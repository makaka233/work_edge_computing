# Default experiment settings.
# The Python entrypoint currently parses the most important values directly via
# argparse; this file is kept as the readable experiment contract.

scenario:
  seed: 2026
  physical_seed: 2026
  num_users: 12000
  num_edge_nodes: 32
  num_service_types: 10
  max_service_stages: 3
  episode_hours: 4
  scenario_refresh_episodes: 4
  scenario_refresh_scope: demand_only
  demand_sampling_mode: episode
  demand_scenario_schedule: shuffled-pool
  demand_scenario_pool_size: 8

time_scales:
  slow_deployment_interval_minutes: 10
  environment_step_seconds: 1
  fast_scheduling_epoch: all_nonempty_groups_per_second

traffic:
  # By default the environment derives aggregate arrivals from user behavior:
  # num_users * active_user_ratio * active_user_request_rate_per_minute,
  # then applies a daily curve with lower night load plus morning/lunch/evening
  # peaks. Use traffic_scale > 1.0 to deliberately create congestion.
  mean_requests_per_minute: null
  active_user_ratio: 0.15
  active_user_request_rate_per_minute: 1.5
  traffic_scale: 1.0
  load_multipliers: [1.0]
  pressure_profile: baseline
  # mec-moderate preset: active_ratio=0.20, active_rate=1.75/min,
  # task_compute=1.65, task_data=2.5, node_capacity=0.65,
  # wired_bandwidth=0.15, service_resource_fraction=0.25, deadline_scale=2.75.
  rollout_start_mode: beginning
  eval_rollout_start_mode: same
  task_compute_scale: 1.0
  task_data_scale: 1.0
  node_compute_capacity_scale: 1.0
  wired_link_bandwidth_scale: 1.0
  topology_k_nearest: 6
  deadline_scale: 1.0
  service_resource_fraction: 0.5
  request_aggregation_window_seconds: 1.0
  load_ewma_tau_minutes: 1.0
  wireless_uplink_mbps: 150.0
  radio_rtt_ms: 10.0

latency_calibration:
  target_single_task_latency_ms: [20, 300]
  task_input_mb_range: [0.05, 1.5]
  stage_compute_gcycles_range: [0.4, 4.0]
  note: >
    Every arriving task is preserved as an individual request. All requests in
    one second compete jointly for compute and link resources, then the
    environment advances by exactly one second.

agent:
  reference_project: DRL-AC-Allocation
  architecture: hierarchical
  slow_policy: service_stage_placement
  slow_encoder: topology_aware_graph_attention
  fast_policy: request_level_stage_scheduling
  continuous_resource_solver: kkt_closed_form
  drl:
    type: dual_agent_ppo
    optimizer_reward_scale: 10.0
    fast_windows_per_update: 1
    slow_windows_per_update: 32
    joint_training_schedule: alternating
    fast_updates_per_cycle: 3
    fast_warmup_updates: 4
    slow_warmup_updates: 4
    synchronized_window_block: 0
    slow_agent_decision: every_10_minutes
    slow_fast_collection_mode: stochastic_frozen
    fast_agent_decision: per_request
    optimizer_update: after_rollout_batch
    max_replicas_per_stage: null
    actual_replica_count: learned_by_count_ppo
    masked_actions: true
    feasibility_repair: true
    slow_count_entropy_coef: null
    slow_placement_entropy_coef: 0.005
    slow_count_lr: 0.00015
    slow_placement_lr: 0.00015
    slow_count_target_kl: 0.015
    slow_placement_target_kl: 0.015
    fast_lr: 0.0002
    fast_entropy_coef: 0.001
    fast_target_kl: 0.015
    slow_tail_latency_coef: 0.35
    slow_value_coef: 0.5
    slow_count_value_coef: 0.0
    slow_critic_lr: 0.0003
    slow_critic_k_epochs: 4
    slow_composite_action_return: factorized_service_stage_return_per_10min_window
    slow_count_advantage: centered_within_service_stage
    slow_placement_advantage: per_node_direct_return_centered_within_service_stage
    slow_count_policy: ordered_discretized_gaussian
    slow_count_initial_scale: action_dimension_divided_by_6
    slow_count_minimum_scale: action_dimension_divided_by_12
    slow_count_actor_baseline: direct_stage_return
    slow_count_critic_gradient: disabled
    slow_deployment_memory_coef: 0.03
    slow_deployment_storage_coef: 0.01
    slow_migration_coef: 0.0
    slow_idle_replica_coef: 0.25
    slow_placement_idle_coef: 0.10
    slow_placement_compute_coef: 0.20
    slow_count_shortage_coef: 0.25
    slow_count_latency_coef: 1.0
    slow_deterministic_count_mode: expected
    slow_deadline_violation_coef: 0.10
    fast_congestion_credit_coef: 1.0
    fast_reservation_microbatch_size: 16
    reward:
      fast: stage_latency_plus_exact_kkt_marginal_externality
      slow: factorized_count_efficiency_and_per_node_placement_latency_utilization_colocation_credit
      resource_shaping_scope: diagnostics_only
      compute_hotspot_threshold: 0.60
      link_hotspot_threshold: 0.60
      compute_hotspot_coef: 0.0
      link_hotspot_coef: 0.0
      compute_imbalance_coef: 0.0
      link_imbalance_coef: 0.0
      idle_deployed_node_coef: 0.0
